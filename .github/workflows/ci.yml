name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  app:
    name: App (lint, typecheck, test, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verifica
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracce-playwright
          path: test-results/
          retention-days: 7

  pacchetto-ha:
    name: Pacchetto Home Assistant (prova su HA vero)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install homeassistant
      - run: python home-assistant/prove/prova_pacchetto.py
