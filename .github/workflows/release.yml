name: Release

# Pubblica una release con jarvis-dist.zip, il cui contenuto va scompattato così
# com'è in /config/www/jarvis/ sul server.
#
# Parte a ogni push sul branch principale: se la versione di package.json NON
# ha ancora una release, rifà TUTTE le verifiche, crea il tag vX.Y.Z sul commit
# verificato e pubblica; se la release esiste già, non fa niente. Quindi: per
# pubblicare si alza la versione (package.json + CHANGELOG.md) e si fa push.
# (Dalle sessioni cloud di Claude non passano né il push dei tag né l'avvio via
# API: per questo il meccanismo è il push.) Si può avviare anche a mano da
# GitHub, o con il push di un tag uguale alla versione.
on:
  push:
    branches: ["claude/new-session-vpjgbq", "main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# In fila, mai in parallelo: due push ravvicinati con la stessa versione nuova
# vedrebbero entrambi "manca la release" e il secondo fallirebbe sul tag già
# creato. In fila, il secondo trova la release fatta e non fa niente.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Versione e tag
        id: versione
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME diverso dalla versione $tag in package.json"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Serve una release nuova?
        id: serve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.versione.outputs.tag }}" >/dev/null 2>&1; then
            echo "La release ${{ steps.versione.outputs.tag }} esiste già: niente da pubblicare."
            echo "nuova=no" >> "$GITHUB_OUTPUT"
          elif ! grep -qx "## ${{ steps.versione.outputs.tag }}" CHANGELOG.md; then
            echo "Manca la sezione '## ${{ steps.versione.outputs.tag }}' in CHANGELOG.md"
            exit 1
          else
            echo "nuova=si" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.serve.outputs.nuova == 'si'
        run: npm ci
      - if: steps.serve.outputs.nuova == 'si'
        run: npx playwright install --with-deps chromium
      - if: steps.serve.outputs.nuova == 'si'
        run: npm run verifica
      - if: steps.serve.outputs.nuova == 'si'
        run: bash scripts/crea-zip.sh
      - name: Pubblica la release
        if: steps.serve.outputs.nuova == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versione.outputs.tag }}
        run: |
          gh release create "$TAG" jarvis-dist.zip \
            --target "$GITHUB_SHA" \
            --title "Jarvis OS $TAG" \
            --notes-file <(awk -v t="## $TAG" '$0==t{f=1;next} /^## /{f=0} f' CHANGELOG.md)
