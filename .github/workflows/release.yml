name: Release

# Pubblica una release con jarvis-dist.zip, il cui contenuto va scompattato così
# com'è in /config/www/jarvis/ sul server. Due modi:
#   - push di un tag uguale alla versione di package.json (git push origin vX.Y.Z);
#   - avvio a mano (workflow_dispatch) su un branch: il tag vX.Y.Z lo crea il
#     workflow stesso sul commit verificato. Serve perché dalle sessioni cloud di
#     Claude il push dei tag non passa.
# In entrambi i casi il workflow rifà TUTTE le verifiche prima di pubblicare.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Versione e tag
        id: versione
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME diverso dalla versione $tag in package.json"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: La release non esiste già
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.versione.outputs.tag }}" >/dev/null 2>&1; then
            echo "La release ${{ steps.versione.outputs.tag }} esiste già: alza la versione in package.json"
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verifica
      - run: bash scripts/crea-zip.sh
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versione.outputs.tag }}
        run: |
          gh release create "$TAG" jarvis-dist.zip \
            --target "$GITHUB_SHA" \
            --title "Jarvis OS $TAG" \
            --notes-file <(awk -v t="## $TAG" '$0==t{f=1;next} /^## /{f=0} f' CHANGELOG.md)
