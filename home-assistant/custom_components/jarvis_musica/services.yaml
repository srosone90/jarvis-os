# Descrizioni dei servizi (le legge HA per l'interfaccia e per Assist).
riproduci:
  name: Riproduci
  description: >-
    Cerca su Spotify e fa partire la musica sul dispositivo della stanza, anche
    se non suona niente. Controlla che suoni davvero.
  fields:
    cosa:
      name: Cosa
      description: Brano, artista, album, playlist o genere da cercare.
      required: true
      example: Miles Davis
      selector:
        text:
    tipo:
      name: Tipo
      description: brano, artista, album, playlist, genere, oppure auto.
      required: false
      default: auto
      selector:
        select:
          options:
            - auto
            - brano
            - artista
            - album
            - playlist
            - genere
    dove:
      name: Dove
      description: Stanza di casa; vuoto = il dispositivo del pannello, poi dove suona già, poi la stanza predefinita.
      required: false
      example: cucina
      selector:
        text:
    pannello:
      name: Pannello
      description: Chi chiede (device_id del pannello, es. jarvis_cucina). Vuoto = dalla pipeline vocale.
      required: false
      selector:
        text:
    dispositivo:
      name: Dispositivo
      description: Nome del dispositivo Spotify su cui suonare. Senza, quello scelto per il pannello.
      required: false
      selector:
        text:
controllo:
  name: Comando
  description: >-
    Comanda la musica in corso leggendo lo stato vero di Spotify, e controlla
    che il comando sia stato eseguito.
  fields:
    azione:
      name: Azione
      description: pausa, riprendi, successivo, precedente, volume, alza, abbassa, sposta.
      required: true
      selector:
        select:
          options:
            - pausa
            - riprendi
            - successivo
            - precedente
            - volume
            - alza
            - abbassa
            - sposta
    dove:
      name: Dove
      description: Solo per sposta, la stanza in cui spostare la musica.
      required: false
      selector:
        text:
    livello:
      name: Livello
      description: Solo per volume, da 0 a 100.
      required: false
      selector:
        number:
          min: 0
          max: 100
    pannello:
      name: Pannello
      description: Chi chiede (device_id del pannello, es. jarvis_cucina). Vuoto = dalla pipeline vocale.
      required: false
      selector:
        text:
    dispositivo:
      name: Dispositivo
      description: Nome del dispositivo Spotify su cui suonare. Senza, quello scelto per il pannello.
      required: false
      selector:
        text:
stato:
  name: Cosa suona
  description: Cosa sta suonando adesso su Spotify, letto dallo stato vero.
playlist:
  name: Playlist
  description: Le playlist dell'account Spotify (nome, uri, copertina). Per farne partire una, riproduci con cosa uguale al suo uri.
dispositivi:
  name: Dispositivi
  description: >-
    I dispositivi Spotify Connect visibili adesso (nome, tipo, attivo, volume) e,
    con pannello, quello scelto per quel pannello.
  fields:
    pannello:
      name: Pannello
      description: device_id del pannello (es. jarvis_cucina).
      required: false
      selector:
        text:
imposta_pannello:
  name: Dispositivo del pannello
  description: Su quale dispositivo Spotify suona un pannello (salvato). Dispositivo vuoto = chiede ogni volta.
  fields:
    pannello:
      name: Pannello
      description: device_id del pannello (es. jarvis_cucina).
      required: true
      selector:
        text:
    dispositivo:
      name: Dispositivo
      description: Nome del dispositivo Spotify; vuoto = cancella.
      required: false
      selector:
        text:
