# =============================================================================
# Jarvis OS · musica — pacchetto per Home Assistant
# =============================================================================
# Va installato INSIEME al componente custom_components/jarvis_musica (senza il
# componente questo file dà errore alla verifica della configurazione).
# Richiede l'integrazione ufficiale Spotify già configurata (account Premium):
# jarvis_musica riusa il suo accesso, non chiede credenziali nuove.
#
# Perché serve: vedi custom_components/jarvis_musica/__init__.py. In breve, con
# l'integrazione standard la musica non si può far partire "dal silenzio".

jarvis_musica:
  # Stanza di casa → dispositivo Spotify Connect, con il NOME ESATTO che usa
  # Spotify. I nomi si leggono nell'attributo `source_list` del media_player
  # Spotify (Strumenti per sviluppatori → Stati) mentre il dispositivo è acceso.
  # Con più nomi si usa il primo che Spotify vede in quel momento.
  # DA COMPILARE con i nomi veri, per esempio:
  #   Camera da letto: Echo Pop Camera
  #   Soggiorno: [TV Samsung, Echo Pop Soggiorno]
  stanze: {}
  # Stanza usata se non si dice dove e non sta suonando niente (facoltativa).
  # predefinita: Soggiorno

script:
  jarvis_musica:
    alias: "Jarvis · musica"
    description: >-
      Fa partire musica da Spotify in una stanza di casa, anche se in quel
      momento non suona niente. cosa: cosa cercare, per esempio "Miles Davis",
      "Bohemian Rhapsody Queen", "jazz", "rock anni 80". tipo: brano, artista,
      album, playlist o genere; auto se non è chiaro. dove: la stanza (per
      esempio "camera da letto"); lascialo vuoto per usare la stanza dove sta
      già suonando. Restituisce esito ok con cosa suona e dove, oppure esito
      errore con un messaggio da riferire. Rispondi con una frase breve. Per
      pausa, volume, brano successivo e "cosa sta suonando" usa il media
      player di Spotify, non questo script.
    icon: mdi:music
    mode: parallel
    fields:
      cosa:
        name: Cosa
        description: "Brano, artista, album, playlist o genere da cercare su Spotify"
        required: true
        example: "Miles Davis"
        selector:
          text:
      tipo:
        name: Tipo
        description: "brano, artista, album, playlist, genere, oppure auto"
        required: false
        default: auto
        selector:
          select:
            options:
              - auto
              - brano
              - artista
              - album
              - playlist
              - genere
      dove:
        name: Dove
        description: "Stanza di casa; vuoto = dove suona già o la stanza predefinita"
        required: false
        example: "camera da letto"
        selector:
          text:
    sequence:
      - action: jarvis_musica.riproduci
        data:
          cosa: "{{ cosa }}"
          tipo: >-
            {{ tipo if tipo is defined and tipo in ['auto', 'brano', 'artista', 'album', 'playlist', 'genere']
               else 'auto' }}
          dove: "{{ dove if dove is defined and dove else '' }}"
        response_variable: esito
      - stop: "Musica"
        response_variable: esito
