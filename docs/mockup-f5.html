<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis OS — mockup F5 (voce)</title>
<style>
  :root { --accent:#5b8def; --bg:#0d0f13; --surface:#171a21; --surface-2:#1f232c; --text:#eef1f6; --muted:#9aa3b2; --warn:#f0a33a; --ok:#3ecf7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:#05060a; color:var(--text); font-family:system-ui,Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; }
  h1 { font-size:18px; margin:0; }
  .nota { color:var(--muted); font-size:13px; max-width:1024px; text-align:center; margin:0; line-height:1.45; }
  .demo { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .demo button { font:inherit; color:inherit; background:#262a33; border:1px solid #3a404c; border-radius:8px; padding:8px 12px; font-size:14px; cursor:pointer; }
  .demo button[aria-pressed="true"] { background:var(--accent); color:#0d0f13; font-weight:600; }
  .schermi { display:flex; gap:24px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
  .et { color:var(--muted); font-size:13px; text-align:center; margin:0 0 6px; }
  .tablet { position:relative; width:1024px; height:600px; border:10px solid #000; border-radius:24px; overflow:hidden;
    background: radial-gradient(900px 500px at 0% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), var(--bg); }
  .telefono { position:relative; width:412px; height:760px; border:10px solid #000; border-radius:28px; overflow:hidden; background:var(--bg); }
  .ora { position:absolute; left:26px; top:14px; font-size:108px; font-weight:200; letter-spacing:-3px; }
  .data { position:absolute; left:26px; top:136px; font-size:22px; color:var(--muted); }
  .blocco { position:absolute; background:var(--surface); border-radius:16px; }
  .chat { position:absolute; display:flex; flex-direction:column; gap:10px; background:color-mix(in srgb, var(--surface) 96%, #000);
    border:1px solid #2b303a; border-radius:20px; padding:12px; }
  .tablet .chat { left:362px; right:16px; top:38px; bottom:16px; }
  .telefono .chat { inset:0; border-radius:0; border:none; }
  .testa { display:flex; align-items:center; gap:10px; padding:0 4px; }
  .testa b { font-size:17px; } .testa small { flex:1; color:var(--muted); font-size:13px; }
  .tondo { width:48px; height:48px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; }
  .msgs { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; padding:4px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:18px; font-size:17px; line-height:1.4; }
  .io { align-self:flex-end; background:color-mix(in srgb, var(--accent) 30%, var(--surface-2)); }
  .io.parziale { opacity:.7; font-style:italic; }
  .jv { align-self:flex-start; background:var(--surface-2); }
  .etich { align-self:flex-start; font-size:14px; color:var(--ok); border:1px solid color-mix(in srgb, var(--ok) 45%, transparent); border-radius:999px; padding:4px 12px; }
  .err { border:1px solid color-mix(in srgb, var(--warn) 60%, transparent); background:color-mix(in srgb, var(--warn) 10%, var(--surface)); border-radius:14px; padding:10px 14px; font-size:15px; line-height:1.4; }
  .err b { color:var(--warn); }
  /* barra della voce: prende il posto del campo di testo */
  .voce { display:flex; align-items:center; gap:14px; min-height:76px; padding:4px 4px 4px 8px; }
  .voce .stato { flex:1; font-size:17px; }
  .voce .stato small { display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  .mic { position:relative; width:68px; height:68px; border-radius:50%; background:var(--accent); color:#0d0f13; display:grid; place-items:center; flex:none; }
  .mic svg { width:30px; height:30px; }
  .anello { position:absolute; inset:-8px; border-radius:50%; border:3px solid var(--accent); opacity:.6; transform:scale(var(--l,1)); transition:transform 80ms linear; }
  .pensa .mic, .risponde .mic { background:var(--surface-2); color:var(--text); }
  .errore .mic { background:var(--surface-2); color:var(--warn); }
  .onde { display:flex; gap:3px; align-items:center; height:28px; }
  .onde i { width:4px; border-radius:2px; background:var(--accent); animation:onda 900ms ease-in-out infinite; }
  .onde i:nth-child(2){animation-delay:.1s}.onde i:nth-child(3){animation-delay:.2s}.onde i:nth-child(4){animation-delay:.3s}
  @keyframes onda { 0%,100%{height:6px} 50%{height:26px} }
  .testo { display:flex; gap:10px; align-items:center; }
  .testo .input { flex:1; min-height:48px; border-radius:999px; border:1px solid #2b303a; display:flex; align-items:center; padding:0 16px; color:var(--muted); font-size:15px; }
</style>
</head>
<body>
  <h1>F5 — voce "tocca per parlare": mockup breve</h1>
  <p class="nota">Il microfono della barra apre la chat già in ascolto. La trascrizione e la risposta finiscono nella chat (stesso motore della F4). Il campo di testo torna quando la voce ha finito.</p>
  <div class="demo" id="stati">
    <button data-v="ascolto" aria-pressed="true">Ascolto</button>
    <button data-v="pensa" aria-pressed="false">Sto pensando</button>
    <button data-v="risponde" aria-pressed="false">Rispondo</button>
    <button data-v="fatto" aria-pressed="false">Finito</button>
    <button data-v="negato" aria-pressed="false">Microfono negato</button>
    <button data-v="https" aria-pressed="false">Senza HTTPS</button>
    <button data-v="quota" aria-pressed="false">Gemini al limite</button>
  </div>
  <div class="schermi">
    <div><p class="et">Tablet 1024×600</p><div class="tablet" id="t"></div></div>
    <div><p class="et">Telefono 412 px</p><div class="telefono" id="f"></div></div>
  </div>
<script>
  const micSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
  const ferma = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';
  const S = {
    ascolto: { cls:"ascolto", titolo:"Ti ascolto…", sotto:"Parla pure. Mi fermo quando smetti, o tocca il pulsante.", mic:ferma, msgs:'<div class="msg io parziale">spegni la tv del…</div>', stato:"in ascolto" },
    pensa: { cls:"pensa", titolo:"Sto pensando…", sotto:"", mic:micSvg, msgs:'<div class="msg io">Spegni la TV del salotto</div>', stato:"sta rispondendo…" },
    risponde: { cls:"risponde", titolo:'<span class="onde"><i></i><i></i><i></i><i></i></span>', sotto:"Tocca per interrompere", mic:ferma, msgs:'<div class="msg io">Spegni la TV del salotto</div><div class="etich">✓ TV Salotto · spenta</div><div class="msg jv">Fatto, ho spento la TV del salotto.</div>', stato:"sta parlando…" },
    fatto: { cls:"fatto", titolo:"", sotto:"", mic:micSvg, msgs:'<div class="msg io">Spegni la TV del salotto</div><div class="etich">✓ TV Salotto · spenta</div><div class="msg jv">Fatto, ho spento la TV del salotto.</div>', stato:"Gemini", testo:true },
    negato: { cls:"errore", titolo:"Microfono non disponibile", sotto:"Chrome ha negato il permesso: tocca il lucchetto accanto all'indirizzo → Microfono → Consenti.", mic:micSvg, msgs:"", stato:"" },
    https: { cls:"errore", titolo:"Serve l'indirizzo sicuro", sotto:"Il microfono funziona solo su https://casa…ts.net. Puoi sempre scrivere.", mic:micSvg, msgs:"", stato:"", testo:true },
    quota: { cls:"errore", titolo:"", sotto:"", mic:micSvg, msgs:'<div class="msg io">Che tempo fa domani?</div><div class="err"><b>Gemini ha raggiunto il limite di richieste.</b><br>Riprova tra un minuto. La domanda è ancora qui.</div>', stato:"Gemini", testo:true },
  };
  let v = "ascolto", livello = 1;
  function chat(s) {
    const barra = s.testo
      ? `<div class="testo"><div class="input">Scrivi…</div><div class="mic" style="width:52px;height:52px">${micSvg}</div></div>`
      : `<div class="voce ${s.cls}"><div class="stato">${s.titolo}<small>${s.sotto}</small></div><div class="mic">${v==="ascolto"?'<span class="anello"></span>':""}${s.mic}</div></div>`;
    return `<div class="chat"><div class="testa"><b>Jarvis</b><small>${s.stato}</small><span class="tondo">+</span><span class="tondo">✕</span></div>
      <div class="msgs">${s.msgs}</div>${barra}</div>`;
  }
  function disegna() {
    const s = S[v];
    document.getElementById("t").innerHTML = `<div class="ora">18:04</div><div class="data">martedì 29 settembre</div><div class="blocco" style="left:26px;top:200px;width:320px;height:110px"></div><div class="blocco" style="left:26px;top:420px;width:320px;height:88px"></div>` + chat(s);
    document.getElementById("f").innerHTML = chat(s);
  }
  document.getElementById("stati").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    for (const x of document.querySelectorAll("#stati button")) x.setAttribute("aria-pressed", String(x === b));
    v = b.dataset.v; disegna();
  });
  // livello del microfono finto: nell'app viene dall'AudioWorklet
  setInterval(() => { livello = 1 + Math.random() * 0.25; for (const a of document.querySelectorAll(".anello")) a.style.setProperty("--l", livello); }, 120);
  disegna();
</script>
</body>
</html>
