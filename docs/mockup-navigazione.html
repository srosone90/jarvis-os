<style>
  :root { --accent:#5b8def; --bg:#0d0f13; --surface:#171a21; --surface-2:#1f232c; --text:#eef1f6; --muted:#9aa3b2; --warn:#f0a33a; --ok:#3ecf7a; }
  * { box-sizing:border-box; }
  body { margin:0; background:#05060a; color:var(--text); font-family:system-ui,Roboto,sans-serif; }
  .foglio { padding:24px; display:flex; flex-direction:column; gap:16px; width:max-content; }
  .foglio > h1 { margin:0; font-size:28px; } .foglio > p { margin:0; color:var(--muted); font-size:17px; max-width:1760px; line-height:1.45; }
  .foglio h2 { margin:6px 0 0; font-size:22px; }
  .riga { display:flex; gap:18px; align-items:flex-start; }
  .cella { display:flex; flex-direction:column; gap:6px; } .cella b { font-size:16px; } .cella small { color:var(--muted); font-size:14px; max-width:440px; line-height:1.35; }
  .cornice { border:6px solid #000; border-radius:14px; overflow:hidden; } .scala { transform-origin:0 0; }
  .schermo { position:relative; overflow:hidden; background:radial-gradient(900px 500px at 0% 0%, #5b8def26, transparent 70%), var(--bg); }
  .tablet { width:1024px; height:600px; } .telo { width:915px; height:412px; }
  .icona { width:26px; height:26px; fill:currentColor; flex:none; }
  .riq { position:absolute; background:var(--surface); border-radius:16px; padding:14px 16px; overflow:hidden; }
  .riq h3 { margin:0 0 8px; font-size:18px; } .riq .m { color:var(--muted); font-size:14px; }
  .ora { font-size:92px; font-weight:200; letter-spacing:-3px; line-height:.95; }
  /* navigazione */
  .dock { position:absolute; left:0; right:0; bottom:0; height:72px; display:flex; background:#10131acc; border-top:1px solid #232834; }
  .dock div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:13px; color:var(--muted); }
  .dock .sel { color:#fff; } .dock .sel .icona { color:var(--accent); }
  .rail { position:absolute; left:0; top:0; bottom:0; width:84px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 0; background:#10131a; border-right:1px solid #232834; }
  .rail div { width:72px; padding:9px 0; border-radius:14px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; color:var(--muted); }
  .rail .sel { background:#1c2640; color:#fff; } .rail .sel .icona { color:var(--accent); }
  .rail .giu { margin-top:auto; }
  .punti { position:absolute; left:50%; transform:translateX(-50%); bottom:10px; display:flex; gap:8px; }
  .punti i { width:9px; height:9px; border-radius:50%; background:#3a404c; } .punti i.sel { background:#fff; width:22px; border-radius:5px; }
  .testa { position:absolute; left:0; right:0; top:0; height:64px; display:flex; align-items:center; gap:14px; padding:0 20px; border-bottom:1px solid #1c2029; }
  .testa h2 { margin:0; font-size:24px; flex:1; } .testa .m { color:var(--muted); font-size:15px; }
  .tondo { width:44px; height:44px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; }
  .menu { position:absolute; inset:0; background:#05060ae6; display:grid; grid-template-columns:repeat(4, 180px); gap:16px; place-content:center; }
  .menu div { background:var(--surface); border:1px solid #232834; border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:10px; font-size:18px; }
  .menu .icona { width:34px; height:34px; color:var(--accent); }
  .barra { position:absolute; display:flex; gap:12px; }
  .barra .chiedi { flex:1; height:56px; border-radius:28px; border:1px solid #2b303a; background:var(--surface); display:flex; align-items:center; padding:0 22px; color:var(--muted); font-size:17px; }
  /* contenuti */
  .lista { display:flex; flex-direction:column; }
  .el { display:flex; align-items:center; gap:14px; padding:12px 4px; border-bottom:1px solid #1c2029; font-size:18px; }
  .el .icona { color:var(--accent); } .el div { flex:1; } .el small { display:block; color:var(--muted); font-size:14px; margin-top:2px; }
  .pill { padding:6px 14px; border-radius:999px; background:var(--surface-2); font-size:15px; }
  .pill.on { background:#1d3a2a; color:#9ff0c2; }
  .grafico { position:relative; height:120px; }
  .ore { display:grid; grid-template-columns:repeat(12, 1fr); gap:6px; text-align:center; font-size:15px; }
  .ore b { font-size:18px; font-weight:500; } .ore small { color:#8fb4ff; }
  .nota-scarto { position:absolute; right:14px; top:14px; padding:6px 12px; border-radius:10px; font-size:14px; background:#2a1f0c; border:1px solid #6b4a14; color:#ffd9a0; }
</style>

const ic = (p) => `<svg class="icona" viewBox="0 0 24 24"><path d="${P[p]}"/></svg>`;
const PRINC = [["casa","Casa"],["nota","Musica"],["meteo","Meteo"],["timer","Timer"],["altro","Altro"]];

/* contenuto della home, con spazio lasciato alla navigazione */
function home(x, y, w, h, tel) {
  const g = 12, cs = tel ? 230 : 300;
  const r = (l,t,ww,hh,c) => `<div class="riq" style="left:${l}px;top:${t}px;width:${ww}px;height:${hh}px">${c}</div>`;
  let s = `<div style="position:absolute;left:${x+6}px;top:${y}px"><div class="ora" style="${tel ? "font-size:72px" : ""}">13:40</div><div class="m" style="color:var(--muted);font-size:${tel ? 16 : 20}px">mercoledì 1 ottobre</div></div>`;
  const top2 = y + (tel ? 104 : 132);
  s += r(x, top2, cs, tel ? 70 : 96, `<h3>${ic("meteo")} 25° sereno</h3><div class="m">max 26° · min 18°</div>`);
  s += r(x, top2 + (tel ? 80 : 108), cs, tel ? 56 : 70, `<h3 style="font-size:16px">${ic("timer")} pasta 8:42</h3>`);
  const dx = x + cs + g, dw = w - cs - g;
  const hh = (h - g) / 2;
  s += r(dx, y, (dw - g) / 2, hh, `<h3>Soggiorno</h3><div class="m">25,7° · 44%</div><div class="el" style="border:none">${ic("tv")}<div>TV Salotto<small>accesa</small></div></div>`);
  s += r(dx + (dw - g) / 2 + g, y, (dw - g) / 2, hh, `<h3>Veranda</h3><div class="m">Scaldabagno spento · inverno</div>`);
  s += r(dx, y + hh + g, dw, hh, `<h3>Camera da letto</h3><div class="m">25,1° · 43% · condizionatore ventola 24°</div>`);
  return s;
}
function nav1(dim) { // dock in basso
  const tel = dim === "telo", W = tel ? 915 : 1024, H = tel ? 412 : 600;
  const dockH = tel ? 58 : 72;
  return `<div class="schermo ${dim}">${home(16, 16, W - 32, H - dockH - 32 - (tel ? 0 : 0), tel)}
    <div class="dock" style="height:${dockH}px">${PRINC.map(([i,t],k) => `<div class="${k ? "" : "sel"}">${ic(i)}${t}</div>`).join("")}<div>${ic("mic")}Jarvis</div></div></div>`;
}
function nav2(dim) { // colonna laterale
  const tel = dim === "telo", W = tel ? 915 : 1024, H = tel ? 412 : 600;
  const rw = tel ? 76 : 84;
  return `<div class="schermo ${dim}"><div class="rail" style="width:${rw}px;${tel ? "gap:0;padding:6px 0" : ""}">${PRINC.map(([i,t],k) => `<div class="${k ? "" : "sel"}" style="${tel ? "padding:5px 0" : ""}">${ic(i)}${t}</div>`).join("")}<div class="giu" style="${tel ? "padding:5px 0" : ""}">${ic("sfera")}Hub</div></div>
    ${home(rw + 16, 16, W - rw - 32, H - (tel ? 32 : 104), tel)}
    ${tel ? "" : `<div class="barra" style="left:${rw + 16}px;right:16px;bottom:16px"><div class="chiedi">Chiedi a Jarvis…</div><div class="tondo" style="width:76px;height:56px;border-radius:28px">${ic("mic")}</div></div>`}</div>`;
}
function nav3(dim, menu) { // niente barra: widget, scorrimento, menu Altro
  const tel = dim === "telo", W = tel ? 915 : 1024, H = tel ? 412 : 600;
  let s = `<div class="schermo ${dim}">${home(16, 16, W - 32, H - (tel ? 50 : 104), tel)}
    ${tel ? "" : `<div class="barra" style="left:16px;right:16px;bottom:30px"><div class="chiedi">Chiedi a Jarvis…</div><div class="tondo" style="width:76px;height:56px;border-radius:28px">${ic("mic")}</div><div class="tondo" style="width:56px;height:56px">${ic("altro")}</div></div>`}
    <div class="punti"><i class="sel"></i><i></i><i></i><i></i></div>`;
  if (menu) s += `<div class="menu" style="${tel ? "grid-template-columns:repeat(5,150px);gap:10px" : ""}">${[["casa","Casa"],["nota","Musica"],["meteo","Meteo"],["timer","Timer e sveglie"],["termo","Clima"],["scena","Scene"],["spesa","Spesa"],["avvisi","Avvisi"],["imp","Impostazioni"],["sfera","Hub"]].map(([i,t]) => `<div style="${tel ? "padding:12px;font-size:16px" : ""}">${ic(i)}${t}</div>`).join("")}</div>`;
  return s + `</div>`;
}

/* ---- le schermate, contenuto al posto della home, con la testa di livello 1 ---- */
function schermata(titolo, sotto, corpo, scarto) {
  return `<div class="schermo tablet"><div class="testa"><span class="tondo">${ic("indietro")}</span><h2>${titolo}</h2><span class="m">${sotto}</span></div>
    <div style="position:absolute;left:20px;right:20px;top:80px;bottom:16px">${corpo}</div>${scarto ? `<div class="nota-scarto">${scarto}</div>` : ""}</div>`;
}
function linea(punti, colore, w, h, min, max) {
  const pts = punti.map((v,i) => `${(i/(punti.length-1))*w},${h - (v-min)/(max-min)*h}`).join(" ");
  return `<svg width="${w}" height="${h}" style="overflow:visible"><polyline points="${pts}" fill="none" stroke="${colore}" stroke-width="3"/></svg>`;
}

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">${[["Buonanotte","spegne la TV del salotto, pannello in modalità notte"],["Esco","spegne TV salotto e condizionatore, ti dice cosa resta"],["Rientro","clima in camera in base alla temperatura percepita"]].map(([t,d]) => `<div class="riq" style="position:relative;height:140px"><h3>${ic("scena")} ${t}</h3><div class="m">${d}</div></div>`).join("")}</div>
    <div class="riq" style="position:relative;margin-top:14px;height:180px"><h3>Routine</h3><div class="m">«Sveglia alle 7 con meteo», «quando esco spegni tutto»: si scrivono in Home Assistant come automazioni, solo l'amministratore.</div><div class="pill" style="display:inline-block;margin-top:14px">Nuova routine (solo admin)</div></div>`, "routine: proposta di rimandarle"),
  timer: () => schermata("Timer e sveglie", "creati anche a voce", `
    <div class="riq" style="left:0;top:0;width:484px;height:494px"><h3>Timer</h3><div class="lista"><div class="el">${ic("timer")}<div>pasta<small>10 minuti</small></div><b style="font-size:28px;font-weight:300">8:42</b></div><div class="el">${ic("timer")}<div>uova<small>6 minuti</small></div><b style="font-size:28px;font-weight:300">3:10</b></div></div><div class="pill" style="display:inline-block;margin-top:14px">+ Nuovo timer</div></div>
    <div class="riq" style="left:500px;top:0;width:484px;height:494px"><h3>Sveglie e promemoria</h3><div class="m">Servono lato server (jarvis_voce): oggi esistono solo i timer. La parte si accende quando il server le avrà.</div></div>`, "sveglie: dopo, lato server"),
  spesa: () => schermata("Lista della spesa", "todo.shopping_list · anche a voce: «aggiungi il latte»", `
    <div class="riq" style="left:0;top:0;width:984px;height:494px"><div class="lista">${[["latte",0],["pane",0],["pasta",0],["detersivo piatti",0],["caffè",1],["uova",1]].map(([t,f]) => `<div class="el" style="${f ? "color:var(--muted);text-decoration:line-through" : ""}">${ic(f ? "check" : "vuoto")}<div>${t}</div></div>`).join("")}</div><div class="pill" style="display:inline-block;margin-top:14px">+ Aggiungi</div></div>`),
  avvisi: () => schermata("Avvisi ed eventi", "cosa è successo in casa", `
    <div style="display:flex;gap:10px;margin-bottom:12px"><span class="pill on">Tutti</span><span class="pill">Dispositivi</span><span class="pill">Batterie</span><span class="pill">Connessione</span></div>
    <div class="riq" style="position:relative;height:440px"><div class="lista">${[["tv","TV Salotto accesa","oggi 13:02 · da Salvatore"],["avvisi","Batteria bassa: sensore camera","oggi 09:15 · 12%"],["termo","Condizionatore camera: ventola 24°","oggi 08:40 · da Jarvis"],["avvisi","Home Assistant non raggiungibile (app Tailscale spenta)","ieri 02:19 → 02:24"],["termo","Scaldabagno spento","ieri 00:00 · programma"]].map(([i,t,s]) => `<div class="el">${ic(i)}<div>${t}<small>${s}</small></div></div>`).join("")}</div></div>`),
};

function cella(t, n, html, sc) {
  const tel = html.includes("telo"); const w = (tel ? 915 : 1024) * sc, h = (tel ? 412 : 600) * sc;
  return `<div class="cella"><b>${t}</b><div class="cornice" style="width:${w+12}px;height:${h+12}px"><div class="scala" style="transform:scale(${sc})">${html}</div></div>${n ? `<small>${n}</small>` : ""}</div>`;
}
function foglioNav() {
  const s = .5, st = .56;
  const blocco = (t, d, a, b, n1) => `<h2>${t}</h2><p style="margin:0;color:var(--muted);font-size:16px">${d}</p><div class="riga">${cella("Tablet", n1, a, s)}${cella("Telefono orizzontale", "", b, st)}</div>`;
  return `<div class="foglio"><h1>Navigazione — tre varianti</h1>
    <p>In tutte: tocco su un riquadro → la sua schermata (meteo → Meteo, stanza → Stanza); «Jarvis, apri la musica»; Indietro di Android sempre funzionante; indirizzo diretto per ogni schermata (…/index.html#musica); massimo 2 livelli; dopo ~90 s senza tocchi si torna al riposo (sfera).</p>
    ${blocco("N1 — Dock in basso", "Cinque schermate principali sempre in vista in basso, più Jarvis. Come le app dei telefoni: si capisce subito. Toglie 72 px di altezza a tutte le schermate: sul tablet la barra «Chiedi a Jarvis» diventa il tasto Jarvis del dock.", nav1("tablet"), nav1("telo"), "Casa, Musica, Meteo, Timer, Altro, Jarvis")}
    ${blocco("N2 — Colonna laterale", "Le principali in una colonna stretta a sinistra, in fondo il tasto Hub. Sul tablet in orizzontale lo spazio in larghezza c'è; resta la barra «Chiedi a Jarvis» di oggi.", nav2("tablet"), nav2("telo"), "in fondo alla colonna il passaggio all'Hub")}
    ${blocco("N3 — Nessuna barra", "Home pulita come oggi: si scorre di lato tra Casa, Musica, Meteo, Timer (i puntini in basso), e il tasto «griglia» apre tutte le schermate. Più spazio, ma le altre schermate si scoprono meno.", nav3("tablet"), nav3("telo", true), "a destra: il menu «griglia» aperto (sul telefono)")}</div>`;
}
function foglioSchermate(elenco, titolo) {
  const s = .44;
  const note = {
    stanza:"1 · Stanza: si apre toccando una stanza. Clima 24 h, musica della stanza, tutti i dispositivi.",
    meteo:"3 · Meteo: 12 ore, 5 giorni, pioggia, alba e tramonto. Tocco sul meteo della home.",
    clima:"4 · Clima ed energia: storico di tutte le stanze e scaldabagno. Proposta: i consumi solo se un sensore c'è.",
    scene:"5 · Scene e routine: le scene sì. Proposta: rimandare la creazione di routine dal pannello (scrive automazioni in HA, rischiosa).",
    timer:"6 · Timer, sveglie e promemoria: i timer ci sono già. Sveglie e promemoria servono prima lato server.",
    spesa:"7 · Lista della spesa: todo.shopping_list di HA, anche a voce. Costa poco.",
    avvisi:"8 · Avvisi ed eventi: dal registro di HA, con filtri.",
  };
  return `<div class="foglio"><h1>${titolo}</h1><p>La navigazione (dock, colonna o nessuna barra) si aggiunge sopra: qui solo il contenuto. La 2 (Musica) è nel gruppo 5; la 9 (Impostazioni) è già scelta (S1 + guida); la 10 (Diagnostica) diventa una sezione delle impostazioni.</p>
    <div class="riga">${elenco.map((k) => cella(note[k].split(":")[0], note[k].split(": ").slice(1).join(": "), S[k](), s)).join("")}</div></div>`;
}
const q = new URLSearchParams(location.search).get("foglio") ?? "nav";
document.getElementById("radice").innerHTML = {
  nav: foglioNav,
  "schermate-1": () => foglioSchermate(["stanza","meteo","clima","scene"], "Nuove schermate (1 di 2)"),
  "schermate-2": () => foglioSchermate(["timer","spesa","avvisi"], "Nuove schermate (2 di 2)"),
}[q]();
</script></body></html>
